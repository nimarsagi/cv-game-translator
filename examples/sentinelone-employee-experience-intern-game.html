<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CV game</title>
<!-- game-template.html: the fixed game, a short flight through one person's life.
     Every run fills only the JSON data block near the end; nothing else changes between runs,
     and cv-check.js fails the run if it does. No word about the person is written here: each one
     comes from that data block and is set with textContent. -->
<style>
  :root {
    --bg: #f3f0e8; --ink: #1d2230; --muted: #5b6273; --card: #ffffff; --line: #d8d1c2;
    --accent: #2f6f73; --accent-ink: #ffffff; --quote: #edf4f3; --frame: #1d1d2b;
    --hud: rgba(9, 13, 34, .86); --hud-ink: #f5f7ff; --glow: #8feaff; --gold: #ffd23f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --ink: #ebe7df; --muted: #a6abb8; --card: #1e222a; --line: #353b47;
      --accent: #63b5ba; --accent-ink: #0c1013; --quote: #1a2a2b; --frame: #000000;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  button { font: inherit; cursor: pointer; }

  /* ---------- the game screen ---------- */
  .app { position: fixed; inset: 0; overflow: hidden; background: #5f86d8; color: var(--hud-ink); touch-action: manipulation; }
  .stage, .stage canvas, .backdrop, .bars { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage canvas { display: block; }
  .backdrop { display: none; background: linear-gradient(#2a73de, #bfe4ff 68%, #ffffff); }
  .backdrop::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: -6%; height: 34%;
    background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0)) 0 0 / 30% 70% repeat-x, rgba(255,255,255,.55);
    border-radius: 50% 50% 0 0; }
  body.plain .stage canvas { display: none; }
  body.plain .backdrop { display: block; }
  body[data-mood="past"] .backdrop { background: linear-gradient(#4d3f8f, #ffa565 68%, #ffe0c2); }
  body[data-mood="future"] .backdrop { background: linear-gradient(#1a2256, #ff9fae 70%, #ffd6e0); }
  .bars::before, .bars::after { content: ""; position: absolute; left: 0; right: 0; height: 8vh; background: #04050b;
    transform: scaleY(0); transition: transform .35s ease; }
  .bars::before { top: 0; transform-origin: top; }
  .bars::after { bottom: 0; transform-origin: bottom; }
  body.flying .bars::before, body.flying .bars::after { transform: scaleY(1); }

  .top { position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: max(10px, env(safe-area-inset-top)) 14px 10px; background: linear-gradient(rgba(4,6,18,.6), rgba(4,6,18,0)); }
  .who { min-width: 0; font-weight: 800; font-style: italic; letter-spacing: .02em; text-shadow: 0 2px 0 rgba(0,0,0,.55); overflow-wrap: anywhere; }
  .btn { min-height: 44px; padding: 8px 16px; border: 2px solid rgba(255,255,255,.92); border-radius: 3px; background: rgba(9,13,34,.72);
    color: #fff; font-weight: 800; transform: skewX(-10deg); box-shadow: 0 3px 0 rgba(0,0,0,.35); white-space: nowrap; }
  .btn > span { display: inline-block; transform: skewX(10deg); }
  .btn:hover { background: rgba(30,40,90,.85); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .btn.primary { background: var(--gold); color: #1a1530; }
  .btn.primary:hover { background: #ffe07a; }
  .btn:disabled { opacity: .35; cursor: default; }
  .controls { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 8px 14px max(10px, env(safe-area-inset-bottom)); background: linear-gradient(rgba(4,6,18,0), rgba(4,6,18,.62)); }
  .controls .mid { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; text-align: center; }
  .step { font: 800 .85rem/1.2 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; text-shadow: 0 1px 0 #000; }
  .keys { font-size: .72rem; line-height: 1.2; color: rgba(255,255,255,.8); text-shadow: 0 1px 0 #000; }
  @media (hover: none), (max-width: 560px) { .keys { display: none; } }

  .chapter { position: absolute; left: 0; top: calc(66px + env(safe-area-inset-top)); z-index: 2; max-width: min(640px, 94%);
    padding: 8px 34px 10px 16px; border-left: 5px solid var(--gold); pointer-events: none;
    background: linear-gradient(90deg, rgba(9,13,34,.88), rgba(9,13,34,.6) 72%, rgba(9,13,34,0)); }
  .chapter .part { font: 800 .72rem/1.2 system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  .chapter .title { font-weight: 800; font-style: italic; font-size: clamp(1.1rem, 1.5vw + .8rem, 1.85rem); line-height: 1.15;
    text-shadow: 0 2px 0 rgba(0,0,0,.6); overflow-wrap: anywhere; }
  .chapter.long .title { font-size: clamp(.95rem, .6vw + .75rem, 1.25rem); }
  .chapter.in { animation: slide .45s cubic-bezier(.2,.9,.3,1.2) both; }
  .banner { position: absolute; left: 0; right: 0; top: 36%; z-index: 2; text-align: center; pointer-events: none; opacity: 0; }
  .banner span { display: inline-block; padding: 10px 70px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: .12em;
    font-size: clamp(2rem, 6.5vw, 4.4rem); line-height: 1.1; color: #fff; text-shadow: 0 0 20px var(--gold), 0 3px 0 #000;
    background: linear-gradient(90deg, rgba(9,13,34,0), rgba(9,13,34,.82) 18%, rgba(9,13,34,.82) 82%, rgba(9,13,34,0)); }
  .banner.show { animation: banner 2s ease-out both; }
  .away { opacity: 0 !important; transition: opacity .2s; pointer-events: none !important; }

  .layer { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    padding: 118px 12px calc(78px + env(safe-area-inset-bottom)); pointer-events: none; }
  .layer.mid { justify-content: center; padding-top: 70px; }
  .layer.high { justify-content: flex-start; padding-top: 74px; }
  .layer > * { pointer-events: auto; width: 100%; max-width: 880px; min-height: 0; }
  .box { position: relative; background: var(--hud); border: 2px solid rgba(255,255,255,.94); border-radius: 5px; padding: 20px 24px 22px;
    box-shadow: 0 0 0 3px rgba(9,13,34,.55), 0 12px 30px rgba(0,0,0,.35); }
  .speaker { position: absolute; left: 18px; top: 0; max-width: calc(100% - 36px); transform: translateY(-58%) skewX(-12deg);
    padding: 2px 16px; background: var(--gold); color: #1a1530; font-weight: 800; border: 2px solid #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .speaker > span { display: inline-block; transform: skewX(12deg); }
  .line { margin: 4px 0 0; max-height: 32vh; overflow-y: auto; font-size: clamp(1.02rem, .9vw + .75rem, 1.32rem); line-height: 1.5; overflow-wrap: anywhere; }
  .more { position: absolute; right: 14px; bottom: 7px; width: 0; height: 0; border: 7px solid transparent; border-top-color: var(--gold);
    animation: blink 1.1s steps(2) infinite; }
  .card { max-width: 780px; max-height: 100%; overflow-y: auto; padding: 16px 22px 18px; border: 2px solid #c6f7ff; border-radius: 5px;
    background: linear-gradient(180deg, rgba(14,40,76,.94), rgba(8,15,38,.94)); overflow-wrap: anywhere;
    box-shadow: 0 0 0 3px rgba(8,15,38,.55), 0 0 28px rgba(110,230,255,.75), inset 0 0 22px rgba(110,230,255,.22); }
  .card.gold { border-color: #ffe9a0; box-shadow: 0 0 0 3px rgba(8,15,38,.55), 0 0 26px rgba(255,210,63,.6), inset 0 0 20px rgba(255,210,63,.18); }
  .card.plainmsg { max-width: 520px; text-align: center; font-size: 1.1rem; }
  .label { margin: 0 0 6px; font: 800 .76rem/1.2 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--glow); }
  .label.ev { margin-top: 14px; color: var(--gold); }
  .asks { margin: 0; font-size: clamp(1.05rem, .7vw + .85rem, 1.25rem); font-weight: 700; line-height: 1.4; }
  .card ul { margin: 0; padding-left: 1.2em; }
  .card li { margin: 5px 0; line-height: 1.45; }
  .card li::marker { color: var(--gold); }
  .card ul.plain { list-style: none; padding: 0; }
  .card .dates { display: block; color: #b9c4ea; font-size: .92rem; }
  .name { margin: 0 0 4px; font-size: clamp(1.6rem, 3vw + 1rem, 2.6rem); font-style: italic; line-height: 1.1; }
  .contact { margin: 0 0 12px; color: #d8e1ff; }
  .contact span + span::before { content: "\00a0\00b7\00a0"; color: var(--gold); }
  .card dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; }
  .card dt { color: #b9c4ea; }
  .card dd { margin: 0; font-weight: 700; }
  .card.end { text-align: center; }
  .end .job { margin: 2px 0; font-size: clamp(1.5rem, 2.6vw + 1rem, 2.5rem); font-weight: 900; font-style: italic; line-height: 1.15; }
  .end .company { margin: 0 0 6px; font-size: 1.15rem; color: #d8e1ff; }
  .end-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 14px; }
  .cut-start::before, .cut-end::after { content: "\2026"; opacity: .75; }
  .quoted::before { content: "\201C"; }
  .quoted::after { content: "\201D"; }
  .pop { animation: pop .38s cubic-bezier(.2,1.3,.4,1) both; }
  .rise { animation: rise .3s ease-out both; }
  @keyframes pop { from { opacity: 0; transform: scale(.72); filter: brightness(2.2); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes slide { from { opacity: 0; transform: translateX(-40px); } }
  @keyframes banner { 0% { opacity: 0; transform: translateX(-14%) skewX(-18deg); } 14% { opacity: 1; transform: none; }
    76% { opacity: 1; } 100% { opacity: 0; transform: translateX(10%); } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .pop, .rise, .chapter.in { animation: rise .01s both; }
    .banner.show { animation: fade 2s both; }
    @keyframes fade { 10%, 80% { opacity: 1; } 100% { opacity: 0; } }
    .bars::before, .bars::after { transition: none; }
  }
  @media (max-width: 560px) {
    .layer { padding-top: 104px; padding-left: 8px; padding-right: 8px; }
    .box { padding: 18px 16px 18px; }
    .card { padding: 14px 16px 16px; }
    .btn { padding: 8px 12px; }
    .chapter { top: calc(58px + env(safe-area-inset-top)); }
  }
  @media (max-height: 480px) {
    .layer { padding-top: 64px; padding-bottom: calc(62px + env(safe-area-inset-bottom)); }
    .chapter { top: 52px; padding-top: 4px; padding-bottom: 4px; }
    .line { max-height: 24vh; }
    .banner { top: 30%; }
  }

  /* ---------- the full CV, one plain page ---------- */
  .full { position: fixed; inset: 0; z-index: 10; overflow-y: auto; padding: 16px; background: rgba(10, 12, 18, .6); color: var(--ink); }
  .full-inner { max-width: 760px; margin: 0 auto; padding: 18px 20px 24px; background: var(--card); border: 2px solid var(--frame); border-radius: 8px; }
  .full-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  .full-head h2 { margin: 0; font: 700 1rem ui-monospace, Menlo, Consolas, monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .full-head button { padding: 8px 14px; border-radius: 6px; border: 2px solid var(--frame); background: var(--card); color: var(--ink); }
  .full-head button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .full h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 6px; overflow-wrap: anywhere; }
  .full h3 { font-size: 1.1rem; margin: 22px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .full h4 { font-size: 1rem; margin: 14px 0 4px; overflow-wrap: anywhere; }
  .full p { margin: 4px 0; overflow-wrap: anywhere; }
  .full .contact { color: var(--muted); }
  .full .contact span + span::before { content: "\00a0\00b7\00a0"; color: var(--muted); }
  .full .flabel { font-weight: 700; font-size: .88rem; color: var(--muted); margin: 8px 0 2px; }
  .full .asks { margin: 0; padding: 8px 12px; background: var(--quote); border-left: 4px solid var(--accent); border-radius: 4px; }
  .full .req { margin: 8px 0 12px 12px; }
  .full ul { margin: 0; padding-left: 1.2em; }
  .full li { margin: 3px 0; overflow-wrap: anywhere; }
  .full ul.plain { list-style: none; padding: 0; }
  .full .dates { display: block; color: var(--muted); font-size: .92rem; }
  .full dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; }
  .full dt { color: var(--muted); }
  .full dd { margin: 0; overflow-wrap: anywhere; }
  @media print {
    html, body { height: auto; overflow: visible; background: #fff; color: #000; }
    .app { display: none !important; }
    .full, .full[hidden] { display: block !important; position: static; overflow: visible; padding: 0; background: none; }
    .full-inner { max-width: none; padding: 0; border: 0; background: #fff; color: #000; }
    .full-head button { display: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stage" aria-hidden="true"><canvas id="world"></canvas><div class="backdrop"></div><div class="bars"></div></div>
  <div class="chapter" id="chapter" hidden aria-live="polite"><div class="part" id="ch-part"></div><div class="title" id="ch-title"></div></div>
  <div class="banner" id="banner" aria-hidden="true"><span id="banner-text"></span></div>
  <div class="layer" id="layer" aria-live="polite"></div>
  <header class="top">
    <div class="who" id="who"></div>
    <button class="btn" id="btn-full" type="button"><span>Show the full CV</span></button>
  </header>
  <nav class="controls" aria-label="Game controls">
    <button class="btn" id="btn-back" type="button"><span>&larr; Back</span></button>
    <div class="mid"><span class="step" id="step"></span><span class="keys">&rarr; Space Enter: Next &middot; &larr;: Back &middot; Esc: Close</span></div>
    <button class="btn primary" id="btn-next" type="button"><span id="next-text">Next &rarr;</span></button>
  </nav>
</div>

<div class="full" id="full" hidden role="dialog" aria-modal="true" aria-labelledby="full-title">
  <div class="full-inner">
    <div class="full-head">
      <h2 id="full-title">Full CV</h2>
      <button id="btn-close" type="button">Close</button>
    </div>
    <div id="full-body"></div>
  </div>
</div>

    } catch (err) {
      toPlain();
    }
  } else toPlain();
  if (!gl) window.addEventListener('resize', fitLayer);
})();
</script>
